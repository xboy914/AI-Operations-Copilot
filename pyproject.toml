[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-operations-copilot"
version = "0.2.0"
description = "Agentic operations workflows with human approval and audit trails"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "pwdlib[argon2]>=0.2",
  "pyjwt>=2.9",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.5",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/operations_copilot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
